<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidas de Conforto - Cuidados Paliativos</title>
    <link rel="stylesheet" href="../../css/style-multipage-v2.css">
</head>
<body>
    <a href="/pages/info.html#informacao" class="info-btn" aria-label="Informações">i</a>
    <div class="screen">
        <button class="back-btn" onclick="window.history.back()">← Voltar</button>
        <h1>Medidas de Conforto</h1>
        <div class="image-button-row">
            <a href="massagem_toque_afetivo.html" class="btn btn-image btn-image-auto">
                <img loading="lazy" decoding="async" src="../../imagens/conforto.jpeg" alt="Conforto">
            </a>
            <a href="terapia_musical.html" class="btn btn-image btn-image-auto">
                <img loading="lazy" decoding="async" src="../../imagens/terapia_musical.jpeg" alt="Terapia Musical">
            </a>
            <a href="aromaterapia.html" class="btn btn-image btn-image-auto">
                <img loading="lazy" decoding="async" src="../../imagens/aroma.jpeg" alt="Aromaterapia">
            </a>
            <a href="../especialidades/espiritualidade.html" class="btn btn-image btn-image-auto">
                <img loading="lazy" decoding="async" src="../../imagens/espiritualidade_conforto.jpeg" alt="Espiritualidade">
            </a>
        </div>
        <div class="table-card">
            <table class="comfort-table">
                <thead>
                    <tr>
                        <th>Sintoma</th>
                        <th>Medida Sugerida</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>Ansiedade/Agitação</strong></td>
                        <td>Aromaterapia (Lavanda) + Música suave.</td>
                    </tr>
                    <tr>
                        <td><strong>Falta de Ar</strong></td>
                        <td>Elevação da cabeceira + Ventilação ambiental.</td>
                    </tr>
                    <tr>
                        <td><strong>Dor Muscular</strong></td>
                        <td>Massagem de conforto com movimentos circulares.</td>
                    </tr>
                    <tr>
                        <td><strong>Boca Seca</strong></td>
                        <td>Hidratação labial e pedaços pequenos de gelo.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <style>
        .image-button-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            width: min(100%, 980px);
        }

        .image-button-row .btn-image-auto {
            max-width: none;
            width: 100%;
            height: 300px;
        }

        .image-button-row .btn-image-auto img {
            width: 100%;
            height: 100%;
            max-width: none;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .image-button-row {
                grid-template-columns: 1fr;
            }

            .image-button-row .btn-image-auto {
                height: 260px;
            }
        }
    </style>
</body>
</html>
